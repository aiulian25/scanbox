name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The image build also vets and tests the SANE driver code, against SANE's test backend.
      # It publishes nothing: images only leave the maintainer's machine, after Trivy.
      - name: Build the image
        run: docker build --build-arg VERSION=dev -t scanbox:ci .
